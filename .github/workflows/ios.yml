name: iOS build
on:
  push:
    paths: ['ios-app/**', '.github/workflows/ios.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ios-app
        run: npm install --no-audit --no-fund
      - name: Add iOS platform
        working-directory: ios-app
        run: |
          set -o pipefail
          mkdir -p ../ci-log
          (npx cap --version && npx cap add ios && npx cap sync ios) 2>&1 | tee ../ci-log/add-ios.txt
      - name: App icon and name
        working-directory: ios-app
        run: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp assets/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Шаг за шагом" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Шаг за шагом" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(node -p "require('./package.json').version")" ios/App/App/Info.plist || true
      - name: Build (unsigned)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../ci-log/xcodebuild-full.txt | tail -n 80
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" ../ci-log/xcodebuild-full.txt | head -50 > ../ci-log/xcodebuild-errors.txt || true
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ShagZaShagom.ipa Payload
          ls -la ShagZaShagom.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ShagZaShagom-ipa
          path: ios-app/ShagZaShagom.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios-app/ShagZaShagom.ipa --title "Шаг за шагом для iPhone" --notes "Файл для установки через Sideloadly/AltStore. Собрано автоматически."
      - name: Save logs to ci-logs branch
        if: always()
        run: |
          mkdir -p ci-log
          cp ci-log/xcodebuild-full.txt ci-log/xcodebuild-full.txt 2>/dev/null || true
          tail -c 200000 ci-log/xcodebuild-full.txt > ci-log/xcodebuild-tail.txt 2>/dev/null || true
          rm -f ci-log/xcodebuild-full.txt
          cd ci-log
          git init -q && git checkout -q -b ci-logs
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "logs ${{ github.run_id }}" || true
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
