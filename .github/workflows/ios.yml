name: iOS build
on:
  push:
    paths: ['ios-app/**', '.github/workflows/ios.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ios-app
        run: npm install --no-audit --no-fund
      - name: Add iOS platform
        working-directory: ios-app
        run: |
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: App icon and name
        working-directory: ios-app
        run: |
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp assets/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Шаг за шагом" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Шаг за шагом" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(node -p "require('./package.json').version")" ios/App/App/Info.plist || true
      - name: Build (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 60
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ShagZaShagom.ipa Payload
          ls -la ShagZaShagom.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ShagZaShagom-ipa
          path: ios-app/ShagZaShagom.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios-app/ShagZaShagom.ipa --title "Шаг за шагом для iPhone" --notes "Файл для установки через Sideloadly/AltStore. Собрано автоматически."
