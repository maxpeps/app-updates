name: Android build
on:
  push:
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: android-app
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        working-directory: android-app
        run: |
          set -o pipefail
          mkdir -p ../ci-log
          sed -i "s/__APK_BUILD__/${{ github.run_number }}/g" www/index.html
          (npx cap --version && npx cap add android && npx cap sync android) 2>&1 | tee ../ci-log/add-android.txt
      - name: Icons, permissions, version
        working-directory: android-app
        run: |
          set -e
          exec > >(tee -a ../ci-log/icons.txt) 2>&1
          R=android/app/src/main/res
          rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          cp -r res/. $R/
          ls $R/mipmap-xxxhdpi $R/drawable | tee -a ../ci-log/add-android.txt
          J=android/app/src/main/java/ru/shagzashagom/app
          mkdir -p $J && cp native/ru/shagzashagom/app/*.java $J/ && ls $J
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />#' $M
          V=$(node -p "require('./package.json').version")
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" $G
          grep -E "versionCode|versionName" $G | tee -a ../ci-log/add-android.txt
          grep -c "permission" $M | tee -a ../ci-log/add-android.txt
          cp $M ../ci-log/AndroidManifest.xml
      - name: Build signed APK
        working-directory: android-app
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tail -3
          npx cap build android --keystorepath "$PWD/signing/release.p12" --keystorepass shagzashagom --keystorealias shag --keystorealiaspass shagzashagom --androidreleasetype APK 2>&1 | tee ../ci-log/build.txt | tail -n 60
          APK=$(find android/app/build/outputs/apk -name '*.apk' | grep -v unsigned | head -1)
          echo "APK=$APK"; cp "$APK" ShagZaShagom.apk; ls -la ShagZaShagom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShagZaShagom-apk
          path: android-app/ShagZaShagom.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest android-app/ShagZaShagom.apk --title "Шаг за шагом для Android" --notes "Установочный файл для Android. Собрано автоматически (сборка ${{ github.run_number }})."
          V=$(node -p "require('./android-app/package.json').version")
          echo "{\"version\":\"$V\",\"build\":${{ github.run_number }},\"url\":\"https://github.com/${{ github.repository }}/releases/download/android-latest/ShagZaShagom.apk\"}" > android-latest.json
          git config user.email ci@example.com && git config user.name ci
          git add android-latest.json && git commit -qm "Android build ${{ github.run_number }}" || true
          for i in 1 2 3; do git push -q && break; git pull -q --rebase --autostash; sleep 3; done
      - name: Save logs to ci-logs-android branch
        if: always()
        run: |
          mkdir -p ci-log && cd ci-log
          git init -q && git checkout -q -b ci-logs-android
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "logs ${{ github.run_id }}" || true
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-android
